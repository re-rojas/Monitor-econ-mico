name: Monitor S&P 500

on:
  schedule:
    # Lunes a viernes. GitHub usa UTC.
    # Con horario de verano de Chile (UTC-3) y horario estándar de EE.UU. (nov–mar):
    #   15:30 UTC = 12:30 Chile = 10:30 Nueva York (1 h tras la apertura)
    #   21:30 UTC = 18:30 Chile = 16:30 Nueva York (tras el cierre)
    # Revisa estas horas cuando EE.UU. o Chile cambien de horario.
    - cron: "30 15 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generar dashboard y enviar Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m monitor

      - name: Guardar histórico
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/history.csv
          git diff --cached --quiet || git commit -m "Histórico $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
